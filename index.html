<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Only For You ❤️</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Dancing+Script:wght@500;600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
}

.box {
  text-align: center;
  color: white;
  z-index: 2;
  padding: 20px;
  max-width: 90%;
}

h1 {
  font-family: 'Pacifico', cursive;
  font-size: 3rem;
  text-shadow: 2px 2px 10px rgba(255,255,255,0.4);
}

p {
  font-family: 'Dancing Script', cursive;
  font-size: 1.6rem;
  min-height: 70px;
}

button {
  margin: 10px;
  padding: 12px 26px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  transition: 0.3s;
  font-family: 'Poppins', sans-serif;
  font-weight: 600;
}

button:hover {
  transform: scale(1.1);
}

.yes {
  background: #00ffb3;
}

.no {
  background: #ff4d6d;
  position: relative;
}

.heart {
  position: absolute;
  color: red;
  animation: float 5s linear infinite;
}

@keyframes float {
  0% { transform: translateY(100vh); opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}
</style>
</head>

<body>

<div class="box" id="content"></div>

<script>

const content = document.getElementById("content");

function typeEffect(element, text, speed, callback) {
  let i = 0;
  element.innerHTML = "";
  const typing = setInterval(() => {
    if (i < text.length) {
      element.innerHTML += text.charAt(i);
      i++;
    } else {
      clearInterval(typing);
      if (callback) callback();
    }
  }, speed);
}

function showQuestion(title, question, buttonsHTML) {
  content.innerHTML = `
    <h1>${title}</h1>
    <p id="typing"></p>
    <div id="buttons"></div>
  `;

  const typingElement = document.getElementById("typing");
  const buttonsDiv = document.getElementById("buttons");

  typeEffect(typingElement, question, 40, () => {
    buttonsDiv.innerHTML = buttonsHTML;

    // Physics: No button follows laws of motion (runs away)
    const noBtn = document.querySelector(".no");
    if (noBtn) {
      noBtn.addEventListener("mouseover", () => {
        noBtn.style.position = "absolute";
        noBtn.style.left = Math.random() * 80 + "vw";
        noBtn.style.top = Math.random() * 80 + "vh";
      });
    }
  });
}

function nextPage(step) {

  if (step === 0) {
    showQuestion(
      "Hey Janvi ❤️",
      "According to Newton’s law… every action has a reaction. So if I fall for you, will you fall back? 🥺",
      `
      <button class="yes" onclick="nextPage(1)">Equal & Opposite 😍</button>
      <button class="no">No Reaction 🙃</button>
      `
    );
  }

  else if (step === 1) {
    showQuestion(
      "Question 1 ⚛️",
      "Are you gravity? Because no matter how hard I try, I keep getting attracted to you 💫",
      `
      <button class="yes" onclick="nextPage(2)">Unavoidable ❤️</button>
      <button class="no">Zero Gravity 😏</button>
      `
    );
  }

  else if (step === 2) {
    showQuestion(
      "Question 2 🔬",
      "Are we like electrons? Because the closer I get to you, the faster my heart beats 😌",
      `
      <button class="yes" onclick="nextPage(3)">Quantum Love 😍</button>
      <button class="no">Too Uncertain 😆</button>
      `
    );
  }

  else if (step === 3) {
    showQuestion(
      "Question 3 🧲",
      "Are you a magnetic field? Because I feel a strong force pulling me toward you 🧲❤️",
      `
      <button class="yes" onclick="nextPage(4)">Strong Field 😍</button>
      <button class="no">Weak Field 😅</button>
      `
    );
  }

  else if (step === 4) {
    showQuestion(
      "Last Question 🥺",
      "If love were a constant… can we make ours universal? 💖",
      `
      <button class="yes" onclick="nextPage(5)">Absolutely 🤞❤️</button>
      <button class="no">Needs Proof 😜</button>
      `
    );
  }

  else if (step === 5) {
    content.innerHTML = `
      <h1>Result Declared 🎓❤️</h1>
      <p>
        Congratulations 🥳<br><br>
        Our love passed all experiments 🔬<br>
        Error = 0, Happiness = ∞ 💞<br><br>
        You just unlocked unlimited hugs 🤗<br>
        Lifetime love subscription activated 💖<br><br>
        Happy Valentine’s Day 💘
      </p>
    `;
  }
}

// Start
nextPage(0);

// Floating hearts
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 20 + 15 + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 5000);
}, 300);

</script>

</body>
</html>

</html>
